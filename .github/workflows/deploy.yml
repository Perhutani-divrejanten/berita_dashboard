name: Deploy Laravel ke cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
      SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
      SFTP_PORT: ${{ secrets.SFTP_PORT }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          if [ -n "$SSH_PASSPHRASE" ]; then
            eval "$(ssh-agent -s)"
            ssh-add ~/.ssh/id_ed25519 <<< "$SSH_PASSPHRASE"
          fi

      - name: Deploy Core Files
        shell: bash
        run: |
          set -e
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.env' \
            --exclude='node_modules' \
            ./ "$SFTP_USERNAME@$SFTP_SERVER:/home/jabarinf/berita_dashboard/"

      - name: Deploy Public Files
        shell: bash
        run: |
          set -e
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='node_modules' \
            ./public/ "$SFTP_USERNAME@$SFTP_SERVER:/home/jabarinf/dashboard_jabarinfo.id/"
